<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><title>Toing Logs</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Tahoma,sans-serif;background:#0f172a;color:#e2e8f0}
.navbar{background:#1e293b;padding:16px 24px;display:flex;gap:24px;align-items:center;border-bottom:1px solid #334155}
.navbar h1{font-size:20px;color:#38bdf8}
.navbar a{color:#94a3b8;text-decoration:none;padding:6px 12px;border-radius:6px}
.navbar a.active{color:#e2e8f0;background:#334155}
.container{max-width:1200px;margin:24px auto;padding:0 24px}
.box{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:16px;height:80vh;overflow:auto;font-family:monospace;font-size:13px;white-space:pre-wrap}
.WIN{color:#4ade80;font-weight:bold}.NOREWARD{color:#fbbf24}.HIT{color:#38bdf8}
.SKIP{color:#c084fc}.ERROR{color:#f87171}.OTPFAIL{color:#f87171}.OTP{color:#38bdf8}.INFO{color:#94a3b8}
</style>
</head>
<body>
<nav class="navbar"><h1>🎯 Toing Dashboard</h1>
<a href="/">Dashboard</a><a href="/logs" class="active">Logs</a><a href="/hits">Hits</a>
<a href="/firebases">Firebase</a><a href="/settings">Settings</a></nav>
<div class="container"><h2 style="margin-bottom:16px">Logs (auto-refresh)</h2><div class="box" id="box"></div></div>
<script>
function refresh(){fetch('/api/logs').then(r=>r.json()).then(logs=>{
  document.getElementById('box').innerHTML=logs.reverse().map(l=>{
    let c='INFO';
    if(l.includes('[OTPFAIL]')||l.includes('[ERROR]'))c='ERROR';
    else if(l.includes('[WIN]'))c='WIN';
    else if(l.includes('[ALREADY]')||l.includes('[NOREWARD]'))c='NOREWARD';
    else if(l.includes('[SKIP]'))c='SKIP';
    else if(l.includes('[OTP]')||l.includes('[HIT]'))c='HIT';
    const s=l.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    return '<div class="'+c+'">'+s+'</div>';
  }).join('');
});}
refresh();setInterval(refresh,2000);
</script>
</body>
</html>
