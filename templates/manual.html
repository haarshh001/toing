<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toing Manual</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0f1c;--panel:#111a2e;--panel2:#0d1526;--border:#1e2b45;--text:#e8eefc;
--muted:#7d8bab;--cyan:#22d3ee;--green:#34d399;--amber:#fbbf24;--red:#f87171;--violet:#a78bfa}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;
background-image:radial-gradient(900px 500px at 12% -10%,rgba(34,211,238,.10),transparent 70%),
radial-gradient(700px 400px at 95% 0%,rgba(167,139,250,.09),transparent 70%)}
.navbar{display:flex;align-items:center;gap:4px;padding:14px 20px;background:rgba(13,21,38,.9);
backdrop-filter:blur(14px);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:800;margin-right:12px}
.brand-mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--cyan),var(--violet));display:grid;place-items:center;font-size:16px}
.navbar a{color:var(--muted);text-decoration:none;padding:8px 11px;border-radius:8px;font-size:12px;font-weight:700;white-space:nowrap}
.navbar a.active{color:var(--cyan);background:rgba(34,211,238,.1)}
.wrap{max-width:760px;margin:0 auto;padding:28px 18px 60px}
.head h1{font-size:24px;font-weight:800;letter-spacing:-.6px}
.head p{color:var(--muted);font-size:13px;margin-top:6px;line-height:1.6}
.card{background:linear-gradient(160deg,var(--panel),var(--panel2));border:1px solid var(--border);
border-radius:16px;padding:20px;margin-top:20px}
.card h3{color:var(--cyan);font-size:15px;margin-bottom:14px}
label{display:block;color:var(--muted);font-size:12px;margin-bottom:6px;font-weight:700}
input{width:100%;padding:12px 14px;background:var(--panel2);color:var(--text);border:1px solid var(--border);
border-radius:10px;font-size:15px;font-family:'JetBrains Mono',monospace;outline:none}
input:focus{border-color:var(--cyan)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.btn{padding:12px 20px;border:none;border-radius:10px;font-weight:800;font-size:13px;cursor:pointer;margin-top:14px;
background:linear-gradient(135deg,var(--cyan),#0ea5e9);color:#06212b;width:100%}
.btn-green{background:linear-gradient(135deg,#34d399,#10b981);color:#06281c}
.msg{margin-top:14px;font-size:13px;line-height:1.6;white-space:pre-wrap;word-break:break-all}
pre{background:#070c17;border:1px solid var(--border);border-radius:10px;padding:14px;font-family:'JetBrains Mono',monospace;
font-size:11.5px;overflow:auto;max-height:300px;color:#a7f3d0;white-space:pre-wrap;word-break:break-all;margin-top:12px}
.hidden{display:none}
.copy{padding:8px 14px;border:1px solid var(--border);border-radius:8px;background:rgba(255,255,255,.06);
color:var(--text);font-size:11px;font-weight:800;cursor:pointer;margin-top:10px}
.toast{position:fixed;bottom:20px;right:20px;background:var(--green);color:#06281c;padding:10px 16px;
border-radius:9px;font-weight:800;font-size:12px;opacity:0;transform:translateY(8px);transition:.25s;pointer-events:none;z-index:50}
.toast.show{opacity:1;transform:none}
@media(max-width:600px){.grid{grid-template-columns:1fr}.navbar{padding:12px 14px}.brand{width:100%}.wrap{padding:20px 14px 50px}.head h1{font-size:21px}}
</style>
</head>
<body>
<nav class="navbar">
  <div class="brand"><div class="brand-mark">🎯</div> Toing</div>
  <a href="/">Dashboard</a><a href="/logs">Logs</a><a href="/hits">Hits</a>
  <a href="/firebases">Firebase</a><a href="/manual" class="active">Manual</a><a href="/settings">Settings</a>
</nav>
<div class="wrap">
  <div class="head"><h1>Manual Referral</h1>
    <p>api_bot.py style — enter a number, use the set referral code, enter the OTP yourself. Separate from the automatic workers.</p></div>

  <div class="card">
    <h3>① Request OTP</h3>
    <div class="grid">
      <div><label>Mobile number</label><input type="tel" id="phone" placeholder="10-digit number" maxlength="10"></div>
      <div><label>Referral code (pre-filled from Settings)</label><input type="text" id="code" value="{{ code }}"></div>
    </div>
    <div style="margin-top:14px"><label>Campaign ID</label><input type="text" id="campaign" value="{{ campaign }}"></div>
    <button class="btn" onclick="startOtp()">📤 Send OTP</button>
    <div class="msg" id="m1"></div>
  </div>

  <div class="card hidden" id="otpCard">
    <h3>② Verify OTP</h3>
    <label>6-digit OTP from SMS</label>
    <input type="text" id="otp" maxlength="6" placeholder="000000" inputmode="numeric">
    <button class="btn btn-green" onclick="verifyOtp()">✅ Verify &amp; claim</button>
    <div class="msg" id="m2"></div>
    <div id="resultBox" class="hidden">
      <div class="msg" id="verdict" style="font-size:15px;font-weight:800"></div>
      <button class="copy" onclick="copySession()">⧉ Copy session JSON</button>
      <pre id="sessJson"></pre>
    </div>
  </div>
</div>
<div class="toast" id="toast">Copied!</div>
<script>
let sid='', sessionObj=null;
function post(u,b){return fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b||{})}).then(r=>r.json());}
function say(id,t,c){const e=document.getElementById(id);e.textContent=t;e.style.color=c||'var(--muted)';}
function toast(){const e=document.getElementById('toast');e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1400);}
function startOtp(){
  const phone=document.getElementById('phone').value.trim();
  const code=document.getElementById('code').value.trim();
  const campaign=document.getElementById('campaign').value.trim();
  say('m1','⏳ Sending OTP via Swiggy API...');
  post('/api/manual/start',{phone,code,campaign}).then(d=>{
    if(d.status==='success'){sid=d.session_id;say('m1','✅ OTP requested. Check the number.','var(--green)');document.getElementById('otpCard').classList.remove('hidden');}
    else say('m1','❌ '+(d.message||'Failed'),'var(--red)');
  });
}
function verifyOtp(){
  const otp=document.getElementById('otp').value.trim();
  say('m2','⏳ Verifying and applying referral...');
  post('/api/manual/verify',{session_id:sid,otp}).then(d=>{
    if(d.status!=='success'){say('m2','❌ '+(d.message||'Failed'),'var(--red)');return;}
    say('m2',d.message||'',d.session?'var(--green)':'var(--amber)');
    const v=document.getElementById('verdict');v.textContent=d.verdict+(d.title?(' — '+d.title):'');
    v.style.color=d.session?'var(--green)':'var(--amber)';
    document.getElementById('resultBox').classList.remove('hidden');
    sessionObj=d.session;
    document.getElementById('sessJson').textContent=d.session?JSON.stringify(d.session,null,2):'(no session - '+(d.message||'')+')';
  });
}
function copySession(){
  if(!sessionObj){toast();return;}
  const t=JSON.stringify(sessionObj,null,2);
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(toast).catch(()=>fb(t));
  else fb(t);
}
function fb(t){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');document.body.removeChild(a);toast();}
</script>
</body>
</html>
